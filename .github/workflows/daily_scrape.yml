name: Daily Agro Media Scraping

on:
  schedule:
    # Gunakan menit ganjil (di luar :00/:15/:30) agar tidak terkena drop antrean jam sibuk GitHub Actions
    # 20:07 UTC = 03:07 WIB (utama: mulai jam 3 lewat 7 pagi agar selesai sebelum jam 4 pagi WIB)
    - cron: '7 20 * * *'
    # 20:37 UTC = 03:37 WIB (cadangan 1: otomatis skip dalam 5 detik jika 03:07 WIB sudah jalan/berhasil)
    - cron: '37 20 * * *'
    # 21:07 UTC = 04:07 WIB (cadangan 2: otomatis skip dalam 5 detik jika sudah berhasil)
    - cron: '7 21 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Mode pengambilan (auto = kemarin, manual = rentang tanggal)'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - manual
      start_date:
        description: 'Tanggal mulai (YYYY-MM-DD, khusus mode manual)'
        required: false
        default: ''
        type: string
      end_date:
        description: 'Tanggal akhir (YYYY-MM-DD, khusus mode manual)'
        required: false
        default: ''
        type: string
      skip_existing:
        description: 'Lewati tanggal yang sudah pernah diambil (true/false)'
        required: false
        default: 'true'
        type: string

concurrency:
  group: agro-daily-scrape
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scrape-and-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TZ: Asia/Jakarta

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ambil data_export dan pipeline_state terbaru dari branch data (jika ada)
        run: |
          mkdir -p hasil_scrapping/snapshots web/public/files web/public/data
          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            git fetch origin data
            git checkout origin/data -- data_export 2>/dev/null || true
            git checkout origin/data -- pipeline_state 2>/dev/null || true
            git reset -q HEAD -- data_export pipeline_state 2>/dev/null || true
            cp -r data_export/files/* web/public/files/ 2>/dev/null || true
            cp -r data_export/*.json web/public/data/ 2>/dev/null || true
            for f in cache_decode.json cache_decode_failed.json cache_decisions.json cache_ai_recheck.json cache_ringkasan.json isu_registry.json; do
              if [ -f "pipeline_state/$f" ]; then
                cp "pipeline_state/$f" "hasil_scrapping/$f.tmp.$$" && mv -f "hasil_scrapping/$f.tmp.$$" "hasil_scrapping/$f"
              elif [ "$f" = "isu_registry.json" ]; then
                echo "[Registry] pipeline_state/isu_registry.json belum ada (run pertama) - mulai dari registri baru."
              fi
            done
            cp -r pipeline_state/snapshots/* hasil_scrapping/snapshots/ 2>/dev/null || true
          else
            echo "[Registry] Branch data belum ada (run pertama) - mulai dari registri baru."
          fi

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cache Pipeline State & AI (Lapis Kedua)
        uses: actions/cache@v4
        with:
          path: |
            hasil_scrapping/cache_decode.json
            hasil_scrapping/cache_decode_failed.json
            hasil_scrapping/cache_decisions.json
            hasil_scrapping/cache_ai_recheck.json
            hasil_scrapping/cache_ringkasan.json
            hasil_scrapping/isu_registry.json
            hasil_scrapping/snapshots
          key: agro-pipeline-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            agro-pipeline-cache-${{ runner.os }}-

      - name: Tentukan rentang tanggal target (WIB)
        id: target_dates
        run: |
          MODE="${{ github.event.inputs.mode || 'auto' }}"
          INPUT_START="${{ github.event.inputs.start_date || '' }}"
          INPUT_END="${{ github.event.inputs.end_date || '' }}"
          SKIP_EXISTING="${{ github.event.inputs.skip_existing || 'true' }}"

          if [ "${{ github.event_name }}" = "schedule" ] || [ "$MODE" = "auto" ]; then
            TRIGGER_LABEL="Terjadwal"
            MODE="auto"
          else
            TRIGGER_LABEL="Manual"
          fi

          if [ "$MODE" = "manual" ] && [ -n "$INPUT_START" ]; then
            RAW_START="$INPUT_START"
            RAW_END="${INPUT_END:-$INPUT_START}"
          else
            YESTERDAY_WIB=$(TZ=Asia/Jakarta date -d "yesterday" +%Y-%m-%d)
            RAW_START="$YESTERDAY_WIB"
            RAW_END="$YESTERDAY_WIB"
          fi

          CHECK_RESULT=$(python scripts/sync_dashboard_data.py --check-dates \
            --start-date "$RAW_START" \
            --end-date "$RAW_END" \
            --skip-existing "$SKIP_EXISTING")

          echo "trigger_label=$TRIGGER_LABEL" >> "$GITHUB_OUTPUT"
          echo "raw_start=$RAW_START" >> "$GITHUB_OUTPUT"
          echo "raw_end=$RAW_END" >> "$GITHUB_OUTPUT"

          if [ "$CHECK_RESULT" = "SKIP" ]; then
            echo "should_skip=true" >> "$GITHUB_OUTPUT"
            echo "start_date=$RAW_START" >> "$GITHUB_OUTPUT"
            echo "end_date=$RAW_END" >> "$GITHUB_OUTPUT"
            echo "Semua tanggal ($RAW_START s/d $RAW_END) sudah ada di data_export. Melewati scraping."
          else
            EFF_START="${CHECK_RESULT%%:*}"
            EFF_END="${CHECK_RESULT##*:}"
            echo "should_skip=false" >> "$GITHUB_OUTPUT"
            echo "start_date=$EFF_START" >> "$GITHUB_OUTPUT"
            echo "end_date=$EFF_END" >> "$GITHUB_OUTPUT"
            echo "Target scraping efektif: $EFF_START s/d $EFF_END ($TRIGGER_LABEL)"
          fi

      - name: Jalankan Pipeline Scraping (main.py)
        id: run_scraper
        if: steps.target_dates.outputs.should_skip != 'true'
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
        run: |
          START_TS=$(date +%s)
          set +e
          python main.py --all \
            --start-date "${{ steps.target_dates.outputs.start_date }}" \
            --end-date "${{ steps.target_dates.outputs.end_date }}"
          EXIT_CODE=$?
          set -e
          END_TS=$(date +%s)
          DURATION=$((END_TS - START_TS))

          echo "duration=$DURATION" >> "$GITHUB_OUTPUT"
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"

          if [ "$EXIT_CODE" -eq 0 ]; then
            echo "run_status=Berhasil" >> "$GITHUB_OUTPUT"
            echo "run_note=" >> "$GITHUB_OUTPUT"
          else
            echo "run_status=Gagal" >> "$GITHUB_OUTPUT"
            echo "run_note=Exit code $EXIT_CODE" >> "$GITHUB_OUTPUT"
          fi
          exit $EXIT_CODE

      - name: Sinkronisasi Data Dashboard & Riwayat Run
        if: always() && steps.target_dates.outputs.should_skip != 'true'
        run: |
          OUTCOME="${{ steps.run_scraper.outcome }}"
          DURATION="${{ steps.run_scraper.outputs.duration || '0' }}"
          LOG_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          if [ "$OUTCOME" = "success" ]; then
            STATUS="Berhasil"
            NOTE=""
          elif [ "$OUTCOME" = "cancelled" ]; then
            STATUS="Gagal"
            NOTE="Dibatalkan"
          else
            STATUS="${{ steps.run_scraper.outputs.run_status }}"
            [ -z "$STATUS" ] && STATUS="Gagal"
            NOTE="${{ steps.run_scraper.outputs.run_note }}"
            [ -z "$NOTE" ] && NOTE="Job dihentikan / timeout"
          fi

          python scripts/sync_dashboard_data.py \
            --start-date "${{ steps.target_dates.outputs.start_date }}" \
            --end-date "${{ steps.target_dates.outputs.end_date }}" \
            --trigger "${{ steps.target_dates.outputs.trigger_label }}" \
            --status "$STATUS" \
            --duration "$DURATION" \
            --note "$NOTE" \
            --log-url "$LOG_URL"

      - name: Commit & Push pembaruan data dan pipeline_state ke branch data dan main
        if: always() && steps.target_dates.outputs.should_skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Pangkas snapshot > 30 hari & batasi ukuran cache sebelum disinkronkan
          python -c "from src.stable import prune_pipeline_caches; print('Prune summary:', prune_pipeline_caches())" || true

          # Simpan perubahan data_export, web/public, dan pipeline_state ke direktori sementara
          mkdir -p /tmp/agro_sync/data_export /tmp/agro_sync/web_public /tmp/agro_sync/pipeline_state/snapshots
          cp -r data_export/* /tmp/agro_sync/data_export/ 2>/dev/null || true
          cp -r web/public/* /tmp/agro_sync/web_public/ 2>/dev/null || true
          for f in cache_decode.json cache_decode_failed.json cache_decisions.json cache_ai_recheck.json cache_ringkasan.json; do
            if [ -f "hasil_scrapping/$f" ]; then
              cp "hasil_scrapping/$f" "/tmp/agro_sync/pipeline_state/$f"
            fi
          done
          cp -r hasil_scrapping/snapshots/* /tmp/agro_sync/pipeline_state/snapshots/ 2>/dev/null || true

          # Simpan hasil_scrapping/isu_registry.json secara atomik + pangkas klaster >14 hari HANYA jika run sukses
          if [ "${{ steps.run_scraper.outcome }}" = "success" ] && [ -f "hasil_scrapping/isu_registry.json" ]; then
            END_DATE="${{ steps.target_dates.outputs.end_date }}" python - <<'PY'
          import datetime, json, os, tempfile
          from pathlib import Path
          from src.isu_grouping import IsuRegistry

          src = Path("hasil_scrapping/isu_registry.json")
          dst = Path("/tmp/agro_sync/pipeline_state/isu_registry.json")
          dst.parent.mkdir(parents=True, exist_ok=True)
          reg = IsuRegistry(filepath=src)
          ref_d = datetime.date.fromisoformat(os.environ["END_DATE"])
          pruned = reg.prune_expired(ref_d)
          payload = {
              "updated_at": datetime.datetime.now().strftime("%Y-%m-%d %H:%M:%S"),
              "issues": list(reg.issues.values()),
          }
          fd, tmp_path = tempfile.mkstemp(prefix=".isu_registry_", suffix=".tmp", dir=str(dst.parent))
          try:
              with os.fdopen(fd, "w", encoding="utf-8") as fh:
                  json.dump(payload, fh, ensure_ascii=False, indent=2)
              os.replace(tmp_path, dst)
              print(f"[Registry] Disiapkan untuk persist atomik ({len(reg.issues)} isu aktif, {pruned} klaster >14 hari dipangkas).")
          except Exception:
              if os.path.exists(tmp_path):
                  os.remove(tmp_path)
              raise
          PY
          else
            echo "[Registry] Melewati penyimpanan isu_registry.json (outcome=${{ steps.run_scraper.outcome }}, ada=$([ -f hasil_scrapping/isu_registry.json ] && echo ya || echo tidak))."
          fi

          # Hapus pipeline_state sementara dari working tree main agar tidak terbawa ke branch main
          rm -rf pipeline_state 2>/dev/null || true

          # 1. Update branch main (agar deployment web dan data_export selalu sinkron)
          git add data_export/ web/public/data/ web/public/files/
          if ! git diff --staged --quiet; then
            git commit -m "chore(data): sinkronisasi data scraping ${{ steps.target_dates.outputs.start_date }} s/d ${{ steps.target_dates.outputs.end_date }}"
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then
                break
              fi
              git pull --rebase origin main || true
            done
          fi

          # 2. Update branch data khusus penyimpanan data + pipeline_state terpisah (rebase & retry jika konflik)
          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            git fetch origin data
            git checkout -B data origin/data
          else
            git checkout -B data
          fi
          mkdir -p data_export web/public pipeline_state/snapshots
          cp -r /tmp/agro_sync/data_export/* data_export/ 2>/dev/null || true
          cp -r /tmp/agro_sync/web_public/* web/public/ 2>/dev/null || true
          for f in /tmp/agro_sync/pipeline_state/*.json; do
            [ -f "$f" ] || continue
            b=$(basename "$f")
            cp "$f" "pipeline_state/${b}.tmp.$$" && mv -f "pipeline_state/${b}.tmp.$$" "pipeline_state/${b}"
          done
          rm -rf pipeline_state/snapshots/* 2>/dev/null || true
          cp -r /tmp/agro_sync/pipeline_state/snapshots/* pipeline_state/snapshots/ 2>/dev/null || true
          git add data_export/ web/public/data/ web/public/files/ pipeline_state/
          if ! git diff --staged --quiet; then
            git commit -m "chore(data): update data & pipeline_state ${{ steps.target_dates.outputs.start_date }} s/d ${{ steps.target_dates.outputs.end_date }}"
            PUSH_OK=false
            for attempt in 1 2 3 4; do
              if git push origin data; then
                PUSH_OK=true
                break
              fi
              echo "Push branch data konflik (percobaan $attempt), pull --rebase dan coba ulang..."
              if ! git pull --rebase origin data; then
                git rebase --abort 2>/dev/null || true
                git fetch origin data
                git reset --hard origin/data
                mkdir -p data_export web/public pipeline_state/snapshots
                cp -r /tmp/agro_sync/data_export/* data_export/ 2>/dev/null || true
                cp -r /tmp/agro_sync/web_public/* web/public/ 2>/dev/null || true
                for f in /tmp/agro_sync/pipeline_state/*.json; do
                  [ -f "$f" ] || continue
                  b=$(basename "$f")
                  cp "$f" "pipeline_state/${b}.tmp.$$" && mv -f "pipeline_state/${b}.tmp.$$" "pipeline_state/${b}"
                done
                cp -r /tmp/agro_sync/pipeline_state/snapshots/* pipeline_state/snapshots/ 2>/dev/null || true
                git add data_export/ web/public/data/ web/public/files/ pipeline_state/
                git commit -m "chore(data): update data & pipeline_state ${{ steps.target_dates.outputs.start_date }} s/d ${{ steps.target_dates.outputs.end_date }}" || true
              fi
            done
            if [ "$PUSH_OK" != "true" ]; then
              echo "::warning::Gagal push branch data setelah 4 percobaan"
            fi
          fi

      - name: Evaluasi status akhir job
        if: always() && steps.target_dates.outputs.should_skip != 'true'
        run: |
          if [ "${{ steps.run_scraper.outputs.exit_code || '0' }}" != "0" ]; then
            echo "::error::Pipeline scraping gagal dengan exit code ${{ steps.run_scraper.outputs.exit_code }}"
            exit 1
          fi

