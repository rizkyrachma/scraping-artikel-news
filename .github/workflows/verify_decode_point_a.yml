name: Verify Point A Decode Benchmark

on:
  push:
    branches:
      - 'verify/**'
  workflow_dispatch:
    inputs:
      target_date:
        description: 'Tanggal target evaluasi (YYYY-MM-DD, kosong = baca dari .github/verify_config.json)'
        required: false
        default: ''
        type: string

concurrency:
  group: verify-point-a-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-decode:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TZ: Asia/Jakarta

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Tentukan tanggal target verifikasi
        id: parse_target
        env:
          INPUT_TARGET_DATE: ${{ github.event.inputs.target_date }}
        shell: bash
        run: |
          if [ -n "$INPUT_TARGET_DATE" ]; then
            TARGET_DATE="$INPUT_TARGET_DATE"
          elif [ -f ".github/verify_config.json" ]; then
            TARGET_DATE=$(python -c 'import json; print(json.load(open(".github/verify_config.json")).get("target_date", "yesterday"))')
          else
            TARGET_DATE="yesterday"
          fi

          if [ "$TARGET_DATE" = "yesterday" ] || [ -z "$TARGET_DATE" ]; then
            TARGET_DATE=$(TZ=Asia/Jakarta date -d "yesterday" +%Y-%m-%d)
          fi

          # Validasi format tanggal target YYYY-MM-DD
          if ! [[ "$TARGET_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "::error::Format tanggal target '$TARGET_DATE' tidak valid! Harus berformat YYYY-MM-DD."
            exit 1
          fi

          echo "target_date=$TARGET_DATE" >> "$GITHUB_OUTPUT"
          echo "Target tanggal verifikasi Poin A: $TARGET_DATE"

      - name: Persiapkan environment verifikasi bersih (cache decode kosong)
        shell: bash
        run: |
          mkdir -p hasil_scrapping verification_output
          # Pastikan cache decode mulai kosong sesuai spesifikasi pengujian benchmark
          rm -f hasil_scrapping/cache_decode.json hasil_scrapping/cache_decode_failed.json

      - name: Jalankan Verifikasi Decode & Ekstraksi (19 Batch, tanpa Gemini)
        id: run_verify
        env:
          TARGET: ${{ steps.parse_target.outputs.target_date }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
        shell: bash
        run: |
          echo "Memulai run decode 19 batch untuk tanggal $TARGET..."
          set +e
          python -u main.py --all --decode-only --date "$TARGET" 2>&1 | tee verification_output/verify_run.log
          PY_EXIT_CODE="${PIPESTATUS[0]}"
          set -e
          echo "Python exit code: $PY_EXIT_CODE"
          if [ "$PY_EXIT_CODE" -ne 0 ]; then
            echo "::error::Eksekusi main.py gagal dengan exit code $PY_EXIT_CODE"
            exit "$PY_EXIT_CODE"
          fi

      - name: Kumpulkan artefak metrik verifikasi
        if: always()
        env:
          TARGET: ${{ steps.parse_target.outputs.target_date }}
        shell: bash
        run: |
          FOLDER=$(find hasil_scrapping -type d -name "$TARGET" 2>/dev/null | head -n 1)
          if [ -z "$FOLDER" ]; then
            FOLDER="hasil_scrapping/$TARGET"
          fi
          if [ -d "$FOLDER" ]; then
            cp "$FOLDER"/verification_point_a_report.md verification_output/ 2>/dev/null || true
            cp "$FOLDER"/verification_point_a_metrics.csv verification_output/ 2>/dev/null || true
            cp "$FOLDER"/progress.json verification_output/progress_checkpoint.json 2>/dev/null || true
          fi
          if [ -f "verification_output/verification_point_a_report.md" ]; then
            cat verification_output/verification_point_a_report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Unggah Artefak Log & Metrik Verifikasi
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-point-a-metrics-${{ steps.parse_target.outputs.target_date }}-${{ github.run_id }}
          path: verification_output/
          retention-days: 30
